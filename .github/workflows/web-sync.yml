name: Web source parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python ATHARV/skysentry/tools/build_site.py --check
      - run: npm --prefix PRANAV run check:web

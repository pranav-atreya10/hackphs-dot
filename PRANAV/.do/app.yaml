# DigitalOcean App Platform spec.
# Create the app with:  doctl apps create --spec PRANAV/.do/app.yaml
name: hackphs-pranav
region: nyc
services:
  - name: web
    github:
      repo: pranav-atreya10/hackphs-dot
      branch: main
      deploy_on_push: true
    source_dir: PRANAV
    environment_slug: node-js
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Secrets: don't commit real values. Set them in the DO dashboard
      # (App → Settings → web → Environment Variables, tick "Encrypt").
      # The server refuses to start in production without CAMERA_API_KEY.
      - key: CAMERA_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: TOWER_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_TIME
      - key: MONGODB_URI
        type: SECRET
        scope: RUN_TIME
      - key: CLERK_PUBLISHABLE_KEY
        scope: RUN_TIME
      - key: CLERK_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: AIRPORT_CODES
        type: SECRET
        scope: RUN_TIME
      # AI step (optional; see ai.js). Leave unset to run with demo stand-ins.
      - key: GEMINI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
        scope: RUN_TIME
      - key: GEMINI_BACKUP_MODEL
        value: gemini-3.5-flash-lite
        scope: RUN_TIME
      # Chatbots (optional; see ai-voice/chat.js). Without a key the tower chat falls back to Gemini.
      - key: OPENAI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: OPENAI_MODEL
        value: gpt-5-mini
        scope: RUN_TIME
      - key: OPENAI_GUIDE_MODEL
        value: gpt-5-nano
        scope: RUN_TIME
      - key: ELEVENLABS_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
        scope: RUN_TIME
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
        scope: RUN_TIME
      - key: SOLANA_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
        scope: RUN_TIME

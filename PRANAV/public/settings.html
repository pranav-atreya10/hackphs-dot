<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkySentry Settings</title>
<meta name="description" content="Your SkySentry account settings: profile, airport access, security and appearance.">
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/app.css">
<style>
  .top{display:flex;align-items:center;gap:8px;max-width:1080px;margin:0 auto;padding:14px 24px}
  .settings{max-width:640px;margin:0 auto;padding:24px 16px 80px;display:grid;gap:16px}
  .settings > h1{margin:0 0 4px;font:600 1.8rem var(--sans)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
  .panel h2{margin:0;font:600 1.05rem var(--sans)}
  .panel > p{margin:0;color:var(--mute)}
  .rows{display:grid}
  .rows div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:.94rem}
  .rows span{color:var(--mute)} .rows b{font-weight:500;text-align:right;overflow-wrap:anywhere}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .actions a{display:inline-flex;align-items:center;font:500 .9rem var(--sans);text-decoration:none;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
  .actions a.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
  .actions a:hover{opacity:.86}
  .seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);justify-self:start}
  .seg label{display:block;cursor:pointer;color:var(--mute);font:500 .9rem var(--sans);padding:7px 14px;border-radius:7px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
  .panel > p.danger{color:var(--stop)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><svg class="mark" viewBox="10 2 80 96" aria-hidden="true"><path fill-rule="evenodd" d="M50 4 L88 16 L88 48 Q88 78 50 96 Q12 78 12 48 L12 16 Z M24 44 Q38 26 50 50 Q62 26 76 44 Q62 34 50 60 Q38 34 24 44 Z"/></svg>SkySentry</a>
</header>
<main class="settings">
  <h1>Settings</h1>
  <section class="panel" id="account" aria-live="polite"><h2>Account</h2><p>Loading…</p></section>
  <section class="panel">
    <h2>Appearance</h2>
    <p>Saved on this device.</p>
    <fieldset class="seg" id="theme" style="margin:0">
      <legend class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Theme</legend>
      <label><input type="radio" name="theme" value="system">System</label>
      <label><input type="radio" name="theme" value="light">Light</label>
      <label><input type="radio" name="theme" value="dark">Dark</label>
    </fieldset>
  </section>
</main>
<script type="module" src="/js/settings.js"></script>
</body>
</html>

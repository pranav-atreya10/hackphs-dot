<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkySentry Settings</title>
<meta name="description" content="Your SkySentry account settings: profile, airport access, security and appearance.">
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/app.css">
<style>
  .top{display:flex;align-items:center;gap:8px;max-width:1080px;margin:0 auto;padding:14px 24px}
  .settings{max-width:640px;margin:0 auto;padding:24px 16px 80px;display:grid;gap:16px}
  .settings > h1{margin:0 0 4px;font:600 1.8rem var(--sans)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
  .panel h2{margin:0;font:600 1.05rem var(--sans)}
  .panel > p{margin:0;color:var(--mute)}
  .rows{display:grid}
  .rows div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:.94rem}
  .rows span{color:var(--mute)} .rows b{font-weight:500;text-align:right;overflow-wrap:anywhere}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .actions a{display:inline-flex;align-items:center;font:500 .9rem var(--sans);text-decoration:none;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
  .actions a.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
  .actions a:hover{opacity:.86}
  .seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);justify-self:start}
  .seg label{display:block;cursor:pointer;color:var(--mute);font:500 .9rem var(--sans);padding:7px 14px;border-radius:7px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
  .panel > p.danger{color:var(--stop)}
  .type-badge{display:inline-block;font:600 .84rem var(--sans);border:1px solid var(--line-2);border-radius:99px;padding:2px 10px}
  .switch{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px} .switch h3{margin:0;font:600 .95rem var(--sans)} .switch p{margin:0;color:var(--mute)}
  .switch .hint{font-size:.86rem} .switch p.danger{color:var(--stop);min-height:0}
  form.req{display:flex;gap:8px} form.req input{flex:1;min-width:0}
  .danger-btn{background:var(--card);color:var(--stop);border:1px solid var(--line);padding:6px 12px;font-size:.86rem} .danger-btn:hover{opacity:1;background:var(--hover)}
  .rows div button{align-self:center}
</style>
</head>
<body class="app">
<aside class="side" id="side">
  <div class="side-head">
    <a class="brand" href="/"><svg class="mark" viewBox="10 2 80 96" aria-hidden="true"><path fill-rule="evenodd" d="M50 4 L88 16 L88 48 Q88 78 50 96 Q12 78 12 48 L12 16 Z M24 44 Q38 26 50 50 Q62 26 76 44 Q62 34 50 60 Q38 34 24 44 Z"/></svg>SkySentry</a>
    <button class="icon-btn side-toggle" type="button" data-side-toggle aria-controls="side" aria-expanded="false" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <nav class="side-nav" aria-label="App"><a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="/tower.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l-1.5 6h-7z"/><path d="M9.5 10v11h5V10M6 21h12"/></svg>Tower</a><a href="/camera.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="14" height="12" rx="2"/><path d="m16.5 10.5 5-3v9l-5-3"/></svg>Camera</a><a href="/demo.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Demos</a><a href="/admin.html" data-admin-only hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>Admin</a></nav>
  <div class="side-foot">
    <a class="who account-tab" href="/settings.html" aria-current="page" title="Account settings"><span class="avatar"><svg class="mark" viewBox="10 2 80 96" aria-hidden="true"><path fill-rule="evenodd" d="M50 4 L88 16 L88 48 Q88 78 50 96 Q12 78 12 48 L12 16 Z M24 44 Q38 26 50 50 Q62 26 76 44 Q62 34 50 60 Q38 34 24 44 Z"/></svg></span><span class="who-text"><b id="who">…</b><small id="whoSub">Account settings</small></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
  </div>
</aside>
<div class="page">
<main class="settings">
  <h1>Settings</h1>
  <section class="panel" id="account" aria-live="polite"><h2>Account</h2><p>Loading…</p></section>
  <section class="panel">
    <h2>Appearance</h2>
    <p>Saved on this device.</p>
    <fieldset class="seg" id="theme" style="margin:0">
      <legend class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Theme</legend>
      <label><input type="radio" name="theme" value="system">System</label>
      <label><input type="radio" name="theme" value="light">Light</label>
      <label><input type="radio" name="theme" value="dark">Dark</label>
    </fieldset>
  </section>
</main>
</div>
<script type="module" src="/js/settings.js"></script>
</body>
</html>

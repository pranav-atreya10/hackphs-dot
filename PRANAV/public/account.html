<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkySentry Account</title>
<meta name="description" content="Sign up or sign in to SkySentry to run a camera station or a tower dashboard for your airport.">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/app.css">
<style>
  body{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
  .top{display:flex;align-items:center;gap:8px;max-width:1080px;width:100%;margin:0 auto;padding:14px 24px}
  #auth{position:static;z-index:auto;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;display:grid;place-items:center;padding:24px 16px 64px}
  #auth .auth-card{max-width:440px}
  .acct{display:grid;gap:8px;margin:4px 0}
  .acct div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem}
  .acct span{color:var(--mute)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .actions a{display:inline-flex;align-items:center;font:500 .9rem var(--sans);text-decoration:none;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
  .actions a:hover{opacity:.86}
  /* Clerk's widget brings its own card; drop its frame so it sits inside ours. */
  #clerk-box .cl-cardBox,#clerk-box .cl-card{box-shadow:none;border:0;background:transparent;width:100%;max-width:none}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><svg class="mark" viewBox="10 2 80 96" aria-hidden="true"><path fill-rule="evenodd" d="M50 4 L88 16 L88 48 Q88 78 50 96 Q12 78 12 48 L12 16 Z M24 44 Q38 26 50 50 Q62 26 76 44 Q62 34 50 60 Q38 34 24 44 Z"/></svg>SkySentry</a>
</header>
<main id="auth" aria-live="polite"><div class="auth-card"><p>Loading…</p></div></main>
<script type="module" src="/js/account.js"></script>
<script src="/js/reveal.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkySentry Camera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{--paper:#f4efe6;--card:#fbf8f2;--ink:#1f1b16;--mute:#6e6458;--line:#ddd2bf;--clay:#c2643f;--go:#2e8b57;--warn:#d99a00;--stop:#c0392b;
        --serif:"Source Serif 4",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
  main{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
  header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font:500 1.7rem var(--serif)}
  #conn{font:500 .78rem var(--mono);color:var(--stop)} #conn[data-ok="1"]{color:var(--go)}
  .view{position:relative;background:#111;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #droneAlert{position:absolute;left:16px;top:16px;background:var(--stop);color:#fff;font:600 1.4rem var(--sans);letter-spacing:.1em;padding:6px 14px;border-radius:6px}
  aside{display:grid;gap:14px;align-content:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
  label{display:grid;gap:4px;font:500 .8rem var(--sans);color:var(--mute)}
  input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
  button{font:600 1rem var(--sans);background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:11px;cursor:pointer}
  button:hover{background:var(--clay)} button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
  #meter{display:grid;gap:2px;border-left:6px solid var(--go);padding-left:12px}
  #meter[data-risk="yellow"]{border-color:var(--warn)} #meter[data-risk="red"]{border-color:var(--stop)}
  #riskLabel{font:500 2rem/1 var(--serif)} #riskReason{color:var(--mute);font-size:.9rem}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font:500 .8rem var(--mono);color:var(--mute)} .stats b{display:block;font:500 1.3rem var(--sans);color:var(--ink)}
  ol{list-style:none;margin:0;padding:0;font:400 .76rem var(--mono);color:var(--mute);max-height:220px;overflow:auto;display:grid;gap:3px}
  .hint{font-size:.8rem;color:var(--mute);margin:0}
  @media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header><h1>Camera station</h1><span id="conn">Connecting…</span></header>
  <div class="view"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div id="droneAlert" hidden>DRONE ALERT</div></div>
  <aside>
    <div class="card" id="meter" data-risk="green"><span id="riskLabel">GREEN</span><span id="riskReason">Press Start</span></div>
    <div class="card stats"><span>Birds<b id="birdCount">0</b></span><span>Drone score<b id="droneScore">0.00</b></span></div>
    <div class="card">
      <label for="cameraId">Camera ID<input id="cameraId" value="runway-east"></label>
      <label for="detector">Bird detector
        <select id="detector"><option value="simulated">Simulated birds (no model)</option><option value="coco-ssd">COCO-SSD (TensorFlow.js)</option><option value="custom">Custom model</option></select></label>
      <label for="sound">Drone listener
        <select id="sound"><option value="simulated">Simulated (hold D)</option><option value="teachable">Teachable Machine</option><option value="off">Off</option></select></label>
      <label for="modelUrl">Teachable Machine model URL<input id="modelUrl" placeholder="https://teachablemachine.withgoogle.com/models/…/"></label>
      <label for="clip">Test clip instead of webcam (optional)<input id="clip" type="file" accept="video/*"></label>
      <button id="start" type="button">Start</button>
      <p class="hint">The shaded left part of the frame is the runway side. Point the camera at the sky by the runway.</p>
    </div>
    <div class="card"><label>Sent to server</label><ol id="log"></ol></div>
  </aside>
</main>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
